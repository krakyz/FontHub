<section class="preview-card"><h2 class="section-bar">Предпросмотр</h2>{% if font is defined %}<div class="settings-content"><button type="button" id="show-remote-preview" data-font-id="{{ font.id }}"{% if not font.files %} disabled{% endif %}>Показать образец</button><p class="muted" id="preview-status" role="status">Предпросмотр не загружен. Ниже отображается системный шрифт.</p></div>{% endif %}<div class="tools"><fieldset class="sample-tool parameter-field"><legend><label for="sample-text">Текст образца</label></legend><textarea id="sample-text" rows="2" style="width:100%">Съешь ещё этих мягких булок</textarea></fieldset><fieldset class="parameter-field"><legend><label for="size">Размер: <output id="size-label">40</output> px</label></legend><input id="size" type="range" min="16" max="100" value="40"></fieldset>{% for axis in face.axes %}<fieldset class="parameter-field"><legend><label for="axis-{{ loop.index }}">{{ axis.tag }}: <output>{{ axis.default }}</output> ({{ axis.min }}–{{ axis.max }})</label></legend><input id="axis-{{ loop.index }}" data-axis="{{ axis.tag }}" type="range" min="{{ axis.min }}" max="{{ axis.max }}" value="{{ axis.default }}" step="0.1"></fieldset>{% endfor %}<fieldset class="parameter-field color-controls"><legend>Цвета</legend><div><label for="text-color">Цвет текста</label><input id="text-color" type="color" value="#202020"></div><div><label for="background-color">Цвет фона</label><input id="background-color" type="color" value="#ffffff"></div></fieldset><div class="presets" role="group" aria-label="Цветовые предустановки"><button type="button" data-fg="#202020" data-bg="#ffffff" style="color:#202020;background:#ffffff">Бумага</button><button type="button" data-fg="#f5f5f5" data-bg="#171717" style="color:#f5f5f5;background:#171717">Тёмный</button><button type="button" data-fg="#30251b" data-bg="#f4ecd8" style="color:#30251b;background:#f4ecd8">Кремовый</button><button type="button" data-fg="#ffffff" data-bg="#16324f" style="color:#ffffff;background:#16324f">Синий</button><button type="button" data-fg="#d4f68a" data-bg="#14251b" style="color:#d4f68a;background:#14251b">Зелёный</button></div></div><div class="specimen" id="sample" style="font-size:40px">Съешь ещё этих мягких булок</div><p id="missing" class="warning"></p></section>
