<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Настройки — FontHub</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/style.css"></head><body>{% include 'header.html' %}<main class="settings-page"><h1>Настройки</h1><section class="settings-panel"><h2 class="section-bar">Образец текста</h2><div class="settings-content"><fieldset class="parameter-field"><legend><label for="default-sample">Стандартная фраза образца</label></legend><textarea id="default-sample" rows="3"></textarea></fieldset></div></section><section class="settings-panel"><h2 class="section-bar">Языки покрытия</h2><div class="settings-content"><p class="muted">Выбранные языки используются в фильтрах каталога и на страницах шрифтов. Настройки сохраняются в этом браузере.</p><fieldset class="parameter-field"><legend><label for="language-search">Поиск языка</label></legend><input id="language-search" placeholder="Название или ISO-код" type="search"></fieldset><div class="language-toolbar"><label><input type="checkbox" id="selected-only"> Только выбранные</label><span id="language-count" role="status"></span></div><div class="language-options">{% for iso,name,alias in languages %}<label data-name="{{ name }} {{ alias }} {{ iso }}"><input type="checkbox" value="{{ iso }}"><span>{{ name }}</span><small>{{ iso }}</small></label>{% endfor %}<label data-name="Японский Japanese jpn ja"><input type="checkbox" value="jpn"><span>Japanese</span><small>jpn · kana</small></label></div><p id="language-empty" class="muted" hidden>Языки не найдены.</p></div></section><div class="settings-save"><button id="save" type="button">Сохранить</button><span id="status" role="status"></span></div></main><script src="/static/settings.js"></script></body></html>
